<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cursed Number</title>
<style>
  :root {
    --bg: #050505;
    --accent: #8b0000;
    --glow: #ff2222;
    --text: #d0d0d0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(80,0,0,0.18) 0%, transparent 70%);
    pointer-events: none;
    animation: pulse 7s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }

  body.shake {
    animation: screenShake 0.35s ease-in-out;
  }

  @keyframes screenShake {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(5px, -4px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(3px, -2px); }
  }

  #title {
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 8px #500, 0 0 20px #300;
    margin-bottom: 1.2rem;
    animation: titleFlicker 5s infinite;
    z-index: 2;
  }

  @keyframes titleFlicker {
    0%, 94%, 100% { opacity: 1; }
    95% { opacity: 0.4; }
    96% { opacity: 1; }
    97% { opacity: 0.2; }
    98% { opacity: 1; }
  }

  #number-wrap {
    position: relative;
    z-index: 2;
  }

  #number {
    font-size: clamp(4rem, 18vw, 14rem);
    font-weight: 700;
    line-height: 1;
    color: var(--glow);
    text-shadow: 0 0 10px #800, 0 0 30px #400;
    cursor: pointer;
    position: relative;
    transition: transform 0.12s ease, color 0.12s ease;
    padding: 0.2em 0.4em;
  }

  #number:hover {
    transform: scale(1.05);
    color: #ff5555;
  }

  #number:active {
    transform: scale(0.95);
  }

  #number::before,
  #number::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  #number::before {
    color: #ff0033;
    animation: glitch-1 2.4s infinite linear alternate-reverse;
  }

  #number::after {
    color: #00ff66;
    animation: glitch-2 2.8s infinite linear alternate-reverse;
  }

  #number.intense::before { animation-duration: 0.45s; }
  #number.intense::after { animation-duration: 0.5s; }

  @keyframes glitch-1 {
    0%, 88%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
    90% { clip-path: inset(18% 0 52% 0); transform: translate(-5px, 2px); }
    92% { clip-path: inset(62% 0 12% 0); transform: translate(4px, -4px); }
    94% { clip-path: inset(8% 0 68% 0); transform: translate(-3px, 1px); }
    96% { clip-path: inset(72% 0 6% 0); transform: translate(6px, -2px); }
  }

  @keyframes glitch-2 {
    0%, 82%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
    84% { clip-path: inset(38% 0 32% 0); transform: translate(5px, -3px); }
    86% { clip-path: inset(6% 0 78% 0); transform: translate(-4px, 3px); }
    88% { clip-path: inset(68% 0 8% 0); transform: translate(3px, -5px); }
    90% { clip-path: inset(22% 0 48% 0); transform: translate(-6px, 2px); }
  }

  #whisper {
    margin-top: 2rem;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    color: #999;
    text-align: center;
    min-height: 2.2em;
    letter-spacing: 0.05em;
    opacity: 0.9;
    transition: opacity 0.35s ease;
    z-index: 2;
  }

  #whisper.fade { opacity: 0; }

  #status {
    margin-top: 0.6rem;
    font-size: 0.85rem;
    color: #555;
    letter-spacing: 0.12em;
    z-index: 2;
  }

  .particle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: #ff2222;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.9;
    box-shadow: 0 0 6px #f00;
  }

  #hint {
    position: fixed;
    bottom: 1.2rem;
    font-size: 0.72rem;
    color: #444;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    z-index: 2;
    text-align: center;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div id="title">The Cursed Number</div>
  <div id="number-wrap">
    <div id="number" data-text="13">13</div>
  </div>
  <div id="whisper">It watches.</div>
  <div id="status">touches: 0</div>
  <div id="hint">click · double-click · hover · space / any key</div>

  <script>
    const numberEl = document.getElementById('number');
    const whisperEl = document.getElementById('whisper');
    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('title');
    const body = document.body;

    let current = 13;
    let clicks = 0;
    let audioCtx = null;
    let drone = null;
    let droneGain = null;
    let lastHoverSound = 0;

    const whispers = [
      "It sees you.",
      "Feed it.",
      "The count rises.",
      "Do not look away.",
      "More... always more.",
      "Your number is known.",
      "Closer than you think.",
      "The curse deepens.",
      "Again.",
      "It remembers every touch.",
      "Stop? Too late.",
      "666 is only the beginning.",
      "The digits rearrange when you blink.",
      "You have been counted.",
      "It grows hungrier.",
      "One more. Just one more.",
      "The sound is inside now.",
      "Do not let go."
    ];

    function getAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function startDrone() {
      if (drone) return;
      const ctx = getAudio();
      drone = ctx.createOscillator();
      droneGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      drone.type = 'sawtooth';
      drone.frequency.value = 38;
      filter.type = 'lowpass';
      filter.frequency.value = 120;

      droneGain.gain.setValueAtTime(0, ctx.currentTime);
      droneGain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 2);

      drone.connect(filter);
      filter.connect(droneGain);
      droneGain.connect(ctx.destination);
      drone.start();
    }

    function updateDroneIntensity() {
      if (!droneGain || !audioCtx) return;
      const target = Math.min(0.025 + clicks * 0.0015, 0.09);
      droneGain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 0.8);
      if (drone) {
        drone.frequency.linearRampToValueAtTime(32 + Math.min(clicks * 0.4, 25), audioCtx.currentTime + 1);
      }
    }

    function playTouchSound(power = 1, type = 'normal') {
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;

        // Main descending saw
        const osc1 = ctx.createOscillator();
        const g1 = ctx.createGain();
        osc1.type = type === 'heavy' ? 'square' : 'sawtooth';
        const startF = (type === 'heavy' ? 90 : 55) + Math.random() * 70 * power;
        osc1.frequency.setValueAtTime(startF, now);
        osc1.frequency.exponentialRampToValueAtTime(12, now + (type === 'heavy' ? 1.1 : 0.65));
        g1.gain.setValueAtTime(0.1 * power, now);
        g1.gain.exponentialRampToValueAtTime(0.001, now + (type === 'heavy' ? 1.2 : 0.75));
        osc1.connect(g1).connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + (type === 'heavy' ? 1.3 : 0.8));

        // High dissonant layer
        const osc2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(320 + Math.random() * 280, now);
        osc2.frequency.exponentialRampToValueAtTime(60, now + 0.28);
        g2.gain.setValueAtTime(0.05 * power, now);
        g2.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc2.connect(g2).connect(ctx.destination);
        osc2.start(now);
        osc2.stop(now + 0.35);

        // Soft noise burst
        if (power > 1.2) {
          const bufferSize = ctx.sampleRate * 0.2;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
          const noise = ctx.createBufferSource();
          const noiseGain = ctx.createGain();
          const noiseFilter = ctx.createBiquadFilter();
          noise.buffer = noiseBuffer;
          noiseFilter.type = 'highpass';
          noiseFilter.frequency.value = 800;
          noiseGain.gain.setValueAtTime(0.08 * power, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
          noise.start(now);
        }
      } catch (e) {}
    }

    function playHoverSound() {
      const now = Date.now();
      if (now - lastHoverSound < 180) return;
      lastHoverSound = now;
      try {
        const ctx = getAudio();
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180 + Math.random() * 40, t);
        osc.frequency.exponentialRampToValueAtTime(90, t + 0.12);
        g.gain.setValueAtTime(0.03, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(g).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      } catch (e) {}
    }

    function spawnParticles(x, y, count = 10) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 3 + Math.random() * 7;
        p.style.width = p.style.height = size + 'px';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = Math.random() > 0.65 ? '#330000' : '#ff3333';
        document.body.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 140;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist - 30;

        p.animate([
          { transform: 'translate(0,0) scale(1)', opacity: 0.95 },
          { transform: `translate(${dx}px, ${dy}px) scale(0.15)`, opacity: 0 }
        ], {
          duration: 550 + Math.random() * 600,
          easing: 'ease-out'
        }).onfinish = () => p.remove();
      }
    }

    function cursedUpdate(strength = 1) {
      const r = Math.random();
      const abs = Math.abs(current);

      if (r < 0.14 && abs > 9) {
        const rev = String(abs).split('').reverse().join('');
        current = parseInt(rev, 10) * (current < 0 ? -1 : 1);
      } else if (r < 0.26) {
        current = Math.floor(current * (0.5 + Math.random() * 2.4 * strength));
      } else if (r < 0.34) {
        current = current * 10 + Math.floor(Math.random() * 10);
      } else {
        const delta = (Math.random() - 0.42) * Math.max(25, abs * 0.18) * strength;
        current = Math.floor(current + delta);
      }

      if (Math.abs(current) > 999999999) {
        current = Math.floor((Math.random() - 0.5) * 12000);
      }
      if (current === 0) current = clicks % 2 === 0 ? 1 : -1;
      return current;
    }

    function showWhisper(text) {
      whisperEl.classList.add('fade');
      setTimeout(() => {
        whisperEl.textContent = text;
        whisperEl.classList.remove('fade');
      }, 180);
    }

    function interact(e, power = 1, type = 'normal') {
      clicks++;
      startDrone();
      updateDroneIntensity();

      current = cursedUpdate(power);
      const display = current.toLocaleString('en-US');
      numberEl.textContent = display;
      numberEl.setAttribute('data-text', display);

      numberEl.classList.add('intense');
      setTimeout(() => numberEl.classList.remove('intense'), 380 + power * 40);

      const rect = numberEl.getBoundingClientRect();
      const cx = (e && e.clientX) ? e.clientX : rect.left + rect.width / 2;
      const cy = (e && e.clientY) ? e.clientY : rect.top + rect.height / 2;
      spawnParticles(cx, cy, Math.floor(8 + power * 6 + Math.min(clicks * 0.3, 10)));

      playTouchSound(power, type);

      if (power >= 1.6) {
        body.classList.add('shake');
        setTimeout(() => body.classList.remove('shake'), 350);
      }

      statusEl.textContent = `touches: ${clicks}`;

      if (clicks % 2 === 0 || Math.random() < 0.3) {
        showWhisper(whispers[Math.floor(Math.random() * whispers.length)]);
      }

      if (clicks > 12) {
        document.documentElement.style.setProperty('--bg', `hsl(0, ${Math.min(45, 8 + clicks * 0.6)}%, 3%)`);
      }

      if (clicks > 25 && Math.random() < 0.12) {
        titleEl.textContent = "THE CURSED NUMBER";
        setTimeout(() => titleEl.textContent = "The Cursed Number", 900);
      }
    }

    // Click
    numberEl.addEventListener('click', (e) => interact(e, 1, 'normal'));

    // Double-click = stronger
    numberEl.addEventListener('dblclick', (e) => {
      e.preventDefault();
      interact(e, 1.8, 'heavy');
    });

    // Hover sound + subtle twitch
    numberEl.addEventListener('mouseenter', () => {
      playHoverSound();
      numberEl.classList.add('intense');
      setTimeout(() => numberEl.classList.remove('intense'), 120);
    });

    // Keyboard (space or any key)
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const power = e.code === 'Space' ? 1.4 : 0.9;
      interact(null, power, power > 1.2 ? 'heavy' : 'normal');
    });

    // Touch support
    numberEl.addEventListener('touchstart', (e) => {
      e.preventDefault();
      interact(e.touches[0], 1, 'normal');
    }, { passive: false });

    // Ambient random glitch after activity
    setInterval(() => {
      if (clicks > 3 && Math.random() < 0.35) {
        numberEl.classList.add('intense');
        setTimeout(() => numberEl.classList.remove('intense'), 140);
        if (Math.random() < 0.4) playHoverSound();
      }
    }, 3800);

    // Initial
    numberEl.setAttribute('data-text', '13');
  </script>
</body>
</html>
