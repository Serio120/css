<html>
<style>

/* Estilos para el div contenedor */
.contenedor-imagen {
  width: 300px;
  height: 300px;
  overflow: hidden; /* Recorta cualquier exceso de la imagen */
}

/*
*********************************************************
*******************************************************
*/

/* Estilos aplicados directamente a la imagen */
.contenedor-imagen img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* Mantiene la proporción de la imagen y la adapta al div */
}


</style>

<div class="contenedor-imagen">
  <img src="for_teaser_motor.jpeg" alt="Descripción de la imagen">
</div>


</html>
